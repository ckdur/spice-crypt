[project]
name = "spice-crypt"
version = "3.0.3"
description = "A library for decrypting LTspice®, PSpice®, and QSPICE® encrypted files"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Joe T. Sylve, Ph.D.", email = "joe.sylve@gmail.com" },
]
keywords = ["ltspice", "pspice", "qspice", "spice", "decryption", "eda", "circuit-simulation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/jtsylve/spice-crypt"
Repository = "https://github.com/jtsylve/spice-crypt"
Issues = "https://github.com/jtsylve/spice-crypt/issues"

[project.scripts]
spice-crypt = "spice_crypt.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.10", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spice_crypt*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# The QSPICE detokenizer deliberately embeds QSPICE's Windows-1252 device-prefix
# and operator characters (Ã, Ø, ¥, ×, «, », ´, µ).  The ambiguous-Unicode lints
# (RUF001/002/003) flag exactly the characters this code must recognize.
"spice_crypt/qspice/cipher.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/gen_qspice_testdata.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_qspice_decrypt.py" = ["RUF001", "RUF002", "RUF003"]
